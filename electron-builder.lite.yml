# ─────────────────────────────────────────────────────────────────────
# BM Player Lite — v1.9.0
# ─────────────────────────────────────────────────────────────────────
# Separate installer product ("BM Player Lite") that:
#   - has a different appId so it can be installed ALONGSIDE the full
#     version (for users who want both, or for side-by-side testing)
#   - includes the lite.flag file in buildResources so main.js auto-
#     detects "this is a Lite build" at boot and forces lite mode
#   - excludes heavy assets that aren't used in lite mode:
#       * plugins/ folder (lite mode disables plugin loading anyway
#         since plugins run in the same renderer context and could
#         re-introduce GPU-heavy rendering that defeats the purpose)
#       * scripts/generate-icon.js dev tooling
#       * assets/icon-source.png (the 200KB source PSD, only needed at
#         build time, never at runtime)
#   - (it shipped 32-bit Windows builds too; current Electron has none)
#
# CI workflow uses this config when triggered by a `vX.Y.Z-lite` tag.
# ─────────────────────────────────────────────────────────────────────

appId: "com.bmplayer.lite"
# No update feed. package.json names the GitHub repository, so without this
# electron-builder would set one up by itself, pointing at the full version's
# latest.yml: an installed Lite would "update" itself into BM Player, and a
# Lite build would overwrite the full version's latest.yml in dist.
publish: null
productName: "BM Player Lite"
copyright: "Copyright © 2026 BM Player"

directories:
  output: "dist-lite"
  buildResources: "buildResources"

files:
  - "main.js"
  - "preload.js"
  - "switches.js"
  - "plugin-safety.js"
  - "plugin-templates/**/*"
  - "src/**/*"
  - "node_modules/**/*"
  - "!node_modules/*/{CHANGELOG.md,README.md,readme.md}"
  - "!node_modules/**/*.d.ts"
  - "!node_modules/.bin"
  - "!dist"
  - "!dist-lite"
  # Exclude heavy dev assets not needed at runtime in lite mode
  - "!assets/**"
  - "!scripts/**"
  - "!plugins/**"
  - "!electron-builder.yml"
  - "!electron-builder.lite.yml"

extraResources:
  - from: "vendor/mpv"
    to: "mpv"
    filter: ["**/*", "!*.md", "!.keep"]
  # The lite.flag file is the build-time marker that main.js looks for
  # to flip into Lite window setup (single opaque window, no bgWin).
  - from: "buildResources/lite.flag"
    to: "lite.flag"

fileAssociations:
  - ext: ["mp4", "m4v", "mkv", "avi", "mov", "wmv", "flv", "webm", "ts",
          "m2ts", "mpg", "mpeg", "ogv", "3gp", "vob"]
    name: "Video File"
    description: "Video file (BM Player Lite)"
    role: "Viewer"
    icon: "buildResources/icon.ico"
  - ext: ["mp3", "flac", "aac", "ogg", "wav", "m4a", "wma", "opus", "ape", "mka"]
    name: "Audio File"
    description: "Audio file (BM Player Lite)"
    role: "Viewer"
    icon: "buildResources/icon.ico"

# ── Windows ─────────────────────────────────────────────────────────
win:
  icon: "buildResources/icon.ico"
  target:
    - target: "nsis"
      # 64-bit only: Electron stopped making 32-bit Windows builds (44.3.0 has
      # win32-x64 and win32-arm64, no ia32; 30.x was the last checked with one).
      arch: ["x64"]
  artifactName: "BM-Player-Lite-Setup-${version}-${arch}.exe"
  requestedExecutionLevel: "asInvoker"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "BM Player Lite"
  installerIcon: "buildResources/icon.ico"
  uninstallerIcon: "buildResources/icon.ico"
  installerHeaderIcon: "buildResources/icon.ico"
  deleteAppDataOnUninstall: false
  # Use the Lite-specific .nsh so file associations register under
  # "BM Player Lite" (not "BM Player") — lets both installers coexist
  # on the same machine without stomping each other's registry entries.
  include: "buildResources/installer.lite.nsh"

# ── macOS ────────────────────────────────────────────────────────────
mac:
  # Made on macOS by scripts/generate-icon.js (sips and iconutil).
  icon: "buildResources/icon.icns"
  category: "public.app-category.video"
  target:
    - target: "dmg"
      arch: ["x64"]            # arm64 machines are all capable-enough
    - target: "zip"
      arch: ["x64"]
  artifactName: "BM-Player-Lite-${version}-${arch}.${ext}"
  # No Apple Developer ID yet, so the app is ad-hoc signed ("-"): Apple
  # Silicon refuses to run an app with no signature at all, and editing
  # Electron's bundle breaks its original one. Hardened runtime stays off: with
  # ad-hoc signing it makes the app fail to launch unless extra entitlements
  # are added (electron-builder warns about this), and it only matters for
  # Apple's notarization, which needs a Developer ID. Turn both on together
  # with a certificate.
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  title: "BM Player Lite ${version}"

# ── Linux ────────────────────────────────────────────────────────────
linux:
  # Debian packages must name a maintainer with an email.
  maintainer: "Bristo <reach.bristo@gmail.com>"
  icon: "buildResources/icon.png"
  category: "AudioVideo"
  target:
    - target: "AppImage"
      arch: ["x64"]
    - target: "deb"
      arch: ["x64"]            # Electron has no 32-bit Linux builds either
  artifactName: "BM-Player-Lite-${version}-${arch}.${ext}"

deb:
  depends: ["mpv"]
