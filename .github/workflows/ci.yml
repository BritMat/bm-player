name: CI

on:
  push:
    branches: [main, master, develop]
    # The checker publishes each stable version as a tag: that builds the
    # Windows installer and creates the GitHub Release (the release job).
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Build the Windows installer and Release for an existing tag, for example v3.22.3 (leave empty to only run the checks)'
        required: false
        default: ''

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    # A tag points at a commit that was already verified when it was pushed.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The file:// three-slash bug, the OS thumbnailer fallback and the
        # path handling in gallery:scan all behave differently per platform.
        # Testing on one OS is how those shipped broken in the first place.
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json needs Node 22.12 or newer (Electron 44). This said 20,
          # so every job stopped at npm ci with EBADENGINE, on all three
          # systems, before a single test ran. A contract now checks it.
          node-version: 22
          cache: npm

      # electron's postinstall downloads a ~100MB binary that none of these
      # checks need. The typings come from the package tarball either way.
      - name: Install
        run: npm ci --no-audit --no-fund
        env:
          # The end-to-end step fetches the binary itself on Linux only.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Syntax
        run: npm run lint:syntax

      - name: Contracts
        run: npm run lint:contracts

      - name: Electron API surface
        run: npm run lint:electron

      - name: PowerShell scripts
        run: npm run lint:powershell

      - name: Plugin safety
        run: npm run test:plugins

      - name: Main process
        run: npm run test:main

      - name: Modules
        run: npm run test:modules

      - name: Renderer
        run: npm run test:smoke

      # The only test that talks to the real mpv. Everything else stubs it,
      # and a stub can only confirm what its author already believed.
      - name: Install mpv (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mpv

      - name: Real mpv
        run: npm run test:mpv

      # The real app in real Electron under a virtual display, driven by
      # Playwright. Its first run found five bugs every other layer missed.
      - name: End-to-end (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq xvfb ffmpeg xcompmgr x11-utils imagemagick
          node node_modules/electron/install.js
          # +extension Composite: part C runs the two-window layout, whose
          # transparent front window needs a compositor.
          xvfb-run -a -s "-screen 0 1600x1000x24 +extension Composite" npm run test:e2e

  build:
    name: Build check
    needs: verify
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      # Proves the icon pipeline works and electron-builder can read the
      # config, without producing (or signing) a real installer.
      - run: npm run gen-icon
      - run: npx electron-builder --linux --dir --publish never
      # Every other test runs the app from the folder. This starts the build
      # electron-builder produced: a file left out of its list (switches.js,
      # v3.19 to v3.22) crashes only the packaged app.
      - name: Packaged app starts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          xvfb-run -a node scripts/smoke-packaged.mjs

  # The Windows installer, as a GitHub Release. Pushing a commit and a tag (what
  # the checker does) creates neither: the Build check above only proves the
  # build works and keeps nothing. Runs for each new version tag, or by hand
  # for an existing one (Actions, CI, Run workflow, with a tag).
  release:
    name: Windows installer and Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
      # The mpv bundled with the installer: a shinchiro/mpv-winbuild-cmake
      # release, pinned so a bad nightly cannot slip in. Bump it on purpose.
      MPV_BUILD: '20260925'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - run: npm ci --no-audit --no-fund

      - name: Fast checks
        shell: bash
        run: npm run lint:syntax && npm run lint:contracts && npm run test:plugins && npm run test:main && npm run test:smoke

      - name: mpv for the installer
        shell: bash
        run: |
          # The plain 64-bit player build: no newer CPU features needed
          # (not the -v3 or -gcc variants, not the -dev library).
          if ! gh release download "$MPV_BUILD" --repo shinchiro/mpv-winbuild-cmake --pattern 'mpv-x86_64-2*.7z' --dir mpvdl; then
            echo "No mpv-x86_64-<date> archive in release $MPV_BUILD. It has:"; gh release view "$MPV_BUILD" --repo shinchiro/mpv-winbuild-cmake --json assets --jq '.assets[].name'; exit 1
          fi
          7z x mpvdl/*.7z -ovendor/mpv -y > /dev/null
          test -f vendor/mpv/mpv.exe || { echo "mpv.exe is not in the mpv archive"; ls -R vendor/mpv | head -40; exit 1; }
          ls vendor/mpv

      - run: npm run gen-icon

      - name: Build the installer
        run: npx electron-builder --win nsis --x64 --publish never

      # The same check as the Build check: an installer whose app crashes on
      # launch is never released.
      - name: The packaged app starts
        run: node scripts/smoke-packaged.mjs

      - name: Create the Release
        shell: bash
        run: |
          ver="${TAG#v}"
          # Only the installer and the updater's two files: electron-builder can leave
          # other executables in dist (an uninstaller stub) that are not for release.
          files=$(ls dist/BM-Player-Setup-*.exe dist/BM-Player-Setup-*.exe.blockmap dist/latest.yml 2>/dev/null)
          test -n "$files" || { echo "no installer in dist"; ls dist; exit 1; }
          cat > notes.md <<EOF
          BM Player $TAG

          **Windows (64-bit):** download **BM-Player-Setup-$ver-x64.exe** and run it. mpv is included. The installer is not code-signed, so Windows SmartScreen may warn: choose **More info**, then **Run anyway**.

          **Linux (64-bit):** on Ubuntu or Debian, download **BM-Player-$ver-amd64.deb** and install it with \`sudo apt install ./BM-Player-$ver-amd64.deb\`, which installs mpv too. On other distributions, download **BM-Player-$ver-x86_64.AppImage**, make it executable and run it, after installing mpv from your package manager.

          You only need one of those files. \`latest.yml\`, \`latest-linux.yml\` and the \`.blockmap\` file are read by BM Player's built-in updater: they tell an installed copy what the newest version is and let it download only the parts that changed.

          Built by GitHub Actions from tag $TAG, after every check passed on a real Windows machine and on GitHub, and each package was started to be sure it launches. The Windows installer bundles mpv from shinchiro/mpv-winbuild-cmake release $MPV_BUILD.

          Marked as a pre-release: installed copies of BM Player do not update to it on their own.
          EOF
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          else
            gh release create "$TAG" $files --title "BM Player $TAG" --notes-file notes.md --prerelease --verify-tag
          fi

  # Linux packages for the same Release: an AppImage for any distribution and
  # a .deb for Ubuntu and Debian (it depends on mpv, so apt installs that too).
  # Runs after the Windows job, which creates the Release.
  release-linux:
    name: Linux packages
    needs: release
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - run: npm ci --no-audit --no-fund

      - run: npm run gen-icon

      - name: Build the packages
        run: npx electron-builder --linux AppImage deb --x64 --publish never

      - name: The packaged app starts, unpacked and as an AppImage
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          xvfb-run -a node scripts/smoke-packaged.mjs
          chmod +x dist/BM-Player-*.AppImage
          xvfb-run -a node scripts/smoke-packaged.mjs "$(ls dist/BM-Player-*.AppImage)"

      - name: Add them to the Release
        run: |
          files=$(ls dist/BM-Player-*.AppImage dist/BM-Player-*.deb dist/latest-linux.yml 2>/dev/null)
          test -n "$files" || { echo "no packages in dist"; ls dist; exit 1; }
          gh release upload "$TAG" $files --clobber
