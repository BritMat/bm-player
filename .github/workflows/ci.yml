name: CI

on:
  push:
    branches: [main, master, develop]
    # The checker publishes each stable version as a tag: that builds the
    # Windows installer and creates the GitHub Release (the release job).
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Build the Windows installer and Release for an existing tag, for example v3.22.3 (leave empty to only run the checks)'
        required: false
        default: ''

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    # A tag points at a commit that was already verified when it was pushed.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The file:// three-slash bug, the OS thumbnailer fallback and the
        # path handling in gallery:scan all behave differently per platform.
        # Testing on one OS is how those shipped broken in the first place.
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json needs Node 22.12 or newer (Electron 44). This said 20,
          # so every job stopped at npm ci with EBADENGINE, on all three
          # systems, before a single test ran. A contract now checks it.
          node-version: 22
          cache: npm

      # electron's postinstall downloads a ~100MB binary that none of these
      # checks need. The typings come from the package tarball either way.
      - name: Install
        run: npm ci --no-audit --no-fund
        env:
          # The end-to-end step fetches the binary itself on Linux only.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Syntax
        run: npm run lint:syntax

      - name: Contracts
        run: npm run lint:contracts

      - name: Electron API surface
        run: npm run lint:electron

      - name: Plugin safety
        run: npm run test:plugins

      - name: Main process
        run: npm run test:main

      - name: Modules
        run: npm run test:modules

      - name: Renderer
        run: npm run test:smoke

      # The only test that talks to the real mpv. Everything else stubs it,
      # and a stub can only confirm what its author already believed.
      - name: Install mpv (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mpv

      - name: Real mpv
        run: npm run test:mpv

      # The real app in real Electron under a virtual display, driven by
      # Playwright. Its first run found five bugs every other layer missed.
      - name: End-to-end (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq xvfb ffmpeg xcompmgr x11-utils imagemagick
          node node_modules/electron/install.js
          # +extension Composite: part C runs the two-window layout, whose
          # transparent front window needs a compositor.
          xvfb-run -a -s "-screen 0 1600x1000x24 +extension Composite" npm run test:e2e

  build:
    name: Build check
    needs: verify
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      # Proves the icon pipeline works and electron-builder can read the
      # config, without producing (or signing) a real installer.
      - run: npm run gen-icon
      - run: npx electron-builder --linux --dir --publish never
      # Every other test runs the app from the folder. This starts the build
      # electron-builder produced: a file left out of its list (switches.js,
      # v3.19 to v3.22) crashes only the packaged app.
      - name: Packaged app starts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          xvfb-run -a node scripts/smoke-packaged.mjs

  # The release, for each new version tag (the checker publishes them), or by
  # hand for an existing one (Actions, CI, Run workflow, with a tag). Windows,
  # Linux and Mac build in parallel, each checked as it will be used, and hand
  # their packages to the publish job, which creates the Release with all of
  # them at once. Windows (full and Lite) and Linux are required: if either
  # fails, nothing is published. The Mac build is experimental and is included
  # when it works. Until v3.25.1 the Windows job created the Release and the
  # others waited for it, so one failed Windows step left the Release with
  # nothing at all.
  release-windows:
    name: Windows installers (full and Lite)
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
    runs-on: windows-latest
    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
      # The mpv the installers download: a shinchiro/mpv-winbuild-cmake
      # release, pinned so a bad nightly cannot slip in. Bump it on purpose.
      MPV_BUILD: '20260925'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - run: npm ci --no-audit --no-fund

      - name: Fast checks
        shell: bash
        run: npm run lint:syntax && npm run lint:contracts && npm run test:plugins && npm run test:main && npm run test:smoke

      # mpv is not inside the installer (it would add about 70 MB): the
      # installer downloads it at install time. This checks the pinned archive
      # and writes its exact address and SHA-256 into the installer, so every
      # installer fetches exactly the file tested here.
      - name: The mpv the installers download
        shell: bash
        run: |
          # The plain 64-bit player build (not -v3 or -gcc, not the -dev library).
          if ! gh release download "$MPV_BUILD" --repo shinchiro/mpv-winbuild-cmake --pattern 'mpv-x86_64-2*.7z' --dir mpvdl; then
            echo "No mpv-x86_64-<date> archive in release $MPV_BUILD. It has:"; gh release view "$MPV_BUILD" --repo shinchiro/mpv-winbuild-cmake --json assets --jq '.assets[].name'; exit 1
          fi
          file=$(ls mpvdl/*.7z | head -1); name=$(basename "$file")
          7z l "$file" | grep -qE ' mpv\.exe$' || { echo "mpv.exe is not at the top of $name"; exit 1; }
          sum=$(sha256sum "$file" | cut -c1-64)
          printf '; Written by the release job: the archive it tested.\n!define MPV_BUILD "%s"\n!define MPV_URL "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/%s/%s"\n!define MPV_SHA256 "%s"\n' "$MPV_BUILD" "$MPV_BUILD" "$name" "$sum" > buildResources/mpv-source.nsh
          cat buildResources/mpv-source.nsh

      - run: npm run gen-icon

      - name: Build the installer
        run: npx electron-builder --win nsis --x64 --publish never

      # An installer whose app crashes on launch is never released.
      - name: The packaged app starts
        run: node scripts/smoke-packaged.mjs

      # A real install on this Windows machine: silent, as updates run it. It
      # must fetch mpv, and the installed app must start.
      - name: The installer installs and fetches mpv
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter 'BM-Player-Setup-*.exe' | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S'
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Depth 2 -Filter 'BM Player.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'the installer did not install BM Player.exe' }
          # What the installer's mpv step did, stage by stage.
          $log = Join-Path $exe.DirectoryName 'resources\mpv-install.log'
          if (Test-Path $log) { Get-Content $log } else { 'no mpv-install.log: the mpv step did not run' }
          $mpv = Join-Path $exe.DirectoryName 'resources\mpv\mpv.com'
          if (-not (Test-Path $mpv)) { throw "the installer did not fetch mpv: no $mpv" }
          & $mpv --version | Select-Object -First 1
          node scripts/smoke-packaged.mjs $exe.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # BM Player Lite: its own installer, installed alongside the full version.
      # No update feed (publish: null). It builds into dist-lite, not dist
      # (electron-builder.lite.yml), so the full installer's files are untouched.
      - name: Build the Lite installer
        run: npx electron-builder --config electron-builder.lite.yml --win nsis --x64 --publish never

      - name: The packaged Lite app starts, in Lite mode
        run: node scripts/smoke-packaged.mjs "dist-lite/win-unpacked/BM Player Lite.exe" --expect-lite

      - name: The Lite installer installs and fetches mpv
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist-lite -Filter 'BM-Player-Lite-Setup-*.exe' | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S'
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Depth 2 -Filter 'BM Player Lite.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'the installer did not install BM Player Lite.exe' }
          # What the installer's mpv step did, stage by stage.
          $log = Join-Path $exe.DirectoryName 'resources\mpv-install.log'
          if (Test-Path $log) { Get-Content $log } else { 'no mpv-install.log: the mpv step did not run' }
          $mpv = Join-Path $exe.DirectoryName 'resources\mpv\mpv.com'
          if (-not (Test-Path $mpv)) { throw "the installer did not fetch mpv: no $mpv" }
          & $mpv --version | Select-Object -First 1
          node scripts/smoke-packaged.mjs $exe.FullName --expect-lite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/BM-Player-Setup-*.exe
            dist/BM-Player-Setup-*.exe.blockmap
            dist/latest.yml
            dist-lite/BM-Player-Lite-Setup-*.exe
          if-no-files-found: error
          retention-days: 5

  # An AppImage for any distribution and a .deb for Ubuntu and Debian (it
  # depends on mpv, so apt installs that too).
  release-linux:
    name: Linux packages
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - run: npm ci --no-audit --no-fund

      - run: npm run gen-icon

      - name: Build the packages
        run: npx electron-builder --linux AppImage deb --x64 --publish never

      - name: The packaged app starts, unpacked and as an AppImage
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          xvfb-run -a node scripts/smoke-packaged.mjs
          chmod +x dist/BM-Player-*.AppImage
          xvfb-run -a node scripts/smoke-packaged.mjs "$(ls dist/BM-Player-*.AppImage)"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/BM-Player-*.AppImage
            dist/BM-Player-*.deb
            dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 5

  # Disk images for Apple Silicon and Intel. Ad-hoc signed: there is no Apple
  # Developer ID, so macOS asks before the first launch. Experimental: video
  # playback has not been tested on a Mac yet.
  release-mac:
    name: macOS disk images (experimental)
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
    runs-on: macos-latest
    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - run: npm ci --no-audit --no-fund

      - run: npm run gen-icon

      - name: Build the disk images
        run: |
          # hdiutil, which makes the .dmg, fails now and then on CI machines
          # ("Resource busy"): one retry.
          npx electron-builder --mac dmg --x64 --arm64 --publish never || { sleep 20; npx electron-builder --mac dmg --x64 --arm64 --publish never; }

      # Starts the build this Mac runs natively (GitHub's Macs are Apple Silicon).
      - name: The packaged app starts
        run: node scripts/smoke-packaged.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/BM-Player-*.dmg
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish the Release
    needs: [release-windows, release-linux, release-mac]
    # Windows and Linux are required. The Mac disk images go in when that job
    # succeeded, and the notes mention them only then.
    if: ${{ always() && needs.release-windows.result == 'success' && needs.release-linux.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
      MPV_BUILD: '20260925'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create the Release
        run: |
          ver="${TAG#v}"
          ls -la assets
          {
            echo "BM Player $TAG"
            echo
            echo "**Windows (64-bit):** download **BM-Player-Setup-$ver-x64.exe** and run it. It downloads mpv, the engine BM Player plays video with, from mpv's Windows builds on GitHub while it installs (so it needs an internet connection), and checks it against the build tested for this release. The installer is not code-signed, so Windows SmartScreen may warn: choose **More info**, then **Run anyway**."
            echo
            echo "**BM Player Lite (Windows, 64-bit):** **BM-Player-Lite-Setup-$ver-x64.exe** is a lighter version for older or low-spec PCs: simpler visuals, one window, and the picture above a fixed control bar. It installs alongside the full version."
            echo
            echo "**Linux (64-bit):** on Ubuntu or Debian, download **BM-Player-$ver-amd64.deb** and install it with \`sudo apt install ./BM-Player-$ver-amd64.deb\`, which installs mpv too. On other distributions, download **BM-Player-$ver-x86_64.AppImage**, make it executable and run it, after installing mpv from your package manager."
            echo
            if ls assets/BM-Player-*.dmg > /dev/null 2>&1; then
              echo "**macOS (experimental):** Apple Silicon (M1 and later): **BM-Player-$ver-arm64.dmg**. Intel: **BM-Player-$ver-x64.dmg**. Install mpv first with \`brew install mpv\`. The app is not notarized by Apple, so the first time macOS refuses to open it: open System Settings, Privacy & Security, and choose **Open Anyway**. If macOS says the app is damaged, run \`xattr -dr com.apple.quarantine \"/Applications/BM Player.app\"\` in Terminal. Video playback has not been tested on a Mac yet: please report what works."
              echo
            fi
            echo "You only need one of those files. \`latest.yml\`, \`latest-linux.yml\` and the \`.blockmap\` file are read by BM Player's built-in updater: they tell an installed copy what the newest version is and let it download only the parts that changed."
            echo
            echo "Built by GitHub Actions from tag $TAG, after every check passed on a real Windows machine and on GitHub. Each installer was installed and started there, and the Windows installers were checked to fetch mpv (shinchiro/mpv-winbuild-cmake release $MPV_BUILD)."
            echo
            echo "Marked as a pre-release: installed copies of BM Player do not update to it on their own."
          } > notes.md
          files=$(ls assets/*)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          else
            gh release create "$TAG" $files --title "BM Player $TAG" --notes-file notes.md --prerelease --verify-tag
          fi
