<!doctype html>
<html lang="en">
<head>
<title>Bricks</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0B0F1A;--fg:#E8ECF5;--mu:#8A93A8;--ac:#6C8CFF;--pn:#151B2B}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;-webkit-user-select:none;user-select:none;overflow:hidden}
.bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.bar b{font-size:18px;letter-spacing:.02em}
.stat{color:var(--mu);font-variant-numeric:tabular-nums}
.stat span{color:var(--fg);font-weight:600}
button,select{font:inherit;color:var(--fg);background:var(--pn);border:1px solid color-mix(in srgb,var(--fg) 18%,transparent);border-radius:9px;padding:6px 14px;cursor:pointer}
button:hover{border-color:var(--ac)}
button:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
canvas{background:var(--pn);border-radius:12px;display:block;max-width:100%}
.msg{min-height:22px;color:var(--mu);text-align:center}
.msg strong{color:var(--fg)}
</style>
<script>
// The app's colours, given in the address (only plain colour codes are taken).
const Q=new URLSearchParams(location.search);
for(const k of ['bg','fg','mu','ac','pn']){const v=Q.get(k);if(v&&/^#[0-9a-f]{3,8}$/i.test(v))document.documentElement.style.setProperty('--'+k,v)}
const css=k=>getComputedStyle(document.documentElement).getPropertyValue('--'+k).trim();
// Kept on this computer, for this game only. A game still plays where nothing can be kept.
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const $=id=>document.getElementById(id);
</script>
</head>
<body>
<div class="bar"><b>Bricks</b><span class="stat">Score <span id="score">0</span></span><span class="stat">Best <span id="best">0</span></span><span class="stat">Lives <span id="lives">3</span></span><button id="new" type="button">New game</button></div>
<canvas id="c" width="640" height="440" tabindex="0" aria-label="Bricks: keep the ball up and clear the bricks"></canvas>
<div class="msg" id="msg"></div>
<script>
// Bricks: a bat, a ball and rows of bricks. Each wall cleared brings a faster one.
const W=640,H=440,COLS=10,ROWS=5,BW=W/COLS,BH=22,TOP=48,C=$('c'),g=C.getContext('2d');
let bat,ball,bricks,score=0,best=store.get('bricks.best',0),lives=3,level=1,state='wait',left=false,right=false,last=0,raf=0;
$('best').textContent=best;
function fit(){const s=Math.min((innerWidth-28)/W,(innerHeight-130)/H);C.style.width=Math.floor(W*s)+'px';C.style.height=Math.floor(H*s)+'px'}
function say(t){$('msg').innerHTML=t}
function wall(){bricks=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)bricks.push({x:c*BW,y:TOP+r*BH,r,on:true})}
function serve(){bat={x:W/2,w:96};ball={x:W/2,y:H-40,vx:0,vy:0,r:7};state='wait';say('Space or a click to send the ball. Arrow keys or the mouse move the bat.')}
function start(){score=0;lives=3;level=1;wall();serve();hud();loop()}
function hud(){$('score').textContent=score;$('lives').textContent=lives;$('best').textContent=best}
function go(){if(state==='held'){state='play';say('');return}if(state!=='wait')return;const sp=250+level*35,a=(Math.random()*.6-.3);ball.vx=sp*Math.sin(a);ball.vy=-sp*Math.cos(a);state='play';say('')}
function over(won){state='over';if(score>best){best=score;store.set('bricks.best',best)}hud();say('<strong>'+(won?'Every wall cleared.':'Game over.')+'</strong> Press Enter for another.')}
function tick(dt){
  const move=(right-left)*520*dt;bat.x=Math.max(bat.w/2,Math.min(W-bat.w/2,bat.x+move));
  if(state==='wait'){ball.x=bat.x;return}
  if(state!=='play')return;
  // in small steps, so the ball cannot pass through a brick between two frames
  const n=Math.max(1,Math.ceil(Math.hypot(ball.vx,ball.vy)*dt/5));
  for(let i=0;i<n;i++){
    ball.x+=ball.vx*dt/n;ball.y+=ball.vy*dt/n;
    if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx)}
    if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)}
    if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy)}
    if(ball.vy>0&&ball.y+ball.r>=H-24&&ball.y+ball.r<=H-8&&Math.abs(ball.x-bat.x)<=bat.w/2+ball.r){
      const sp=Math.hypot(ball.vx,ball.vy),a=Math.max(-1.1,Math.min(1.1,(ball.x-bat.x)/(bat.w/2)*1.05));
      ball.vx=sp*Math.sin(a);ball.vy=-sp*Math.cos(a);ball.y=H-24-ball.r;
    }
    if(ball.y>H+20){lives--;hud();if(lives<=0)return over(false);serve();return}
    for(const b of bricks){
      if(!b.on||ball.x+ball.r<b.x||ball.x-ball.r>b.x+BW||ball.y+ball.r<b.y||ball.y-ball.r>b.y+BH)continue;
      b.on=false;score+=10*(ROWS-b.r);hud();
      const ox=Math.min(ball.x+ball.r-b.x,b.x+BW-(ball.x-ball.r)),oy=Math.min(ball.y+ball.r-b.y,b.y+BH-(ball.y-ball.r));
      if(ox<oy)ball.vx=-ball.vx;else ball.vy=-ball.vy;
      break;
    }
  }
  if(bricks.every(b=>!b.on)){if(level>=8)return over(true);level++;wall();serve();say('Wall '+level+'. Space or a click to send the ball.')}
}
function draw(){
  g.clearRect(0,0,W,H);
  const ac=css('ac'),fg=css('fg');
  for(const b of bricks){if(!b.on)continue;g.globalAlpha=1-b.r*.14;g.fillStyle=ac;g.beginPath();g.roundRect(b.x+2,b.y+2,BW-4,BH-4,5);g.fill()}
  g.globalAlpha=1;g.fillStyle=fg;
  g.beginPath();g.roundRect(bat.x-bat.w/2,H-24,bat.w,12,6);g.fill();
  g.beginPath();g.arc(ball.x,ball.y,ball.r,0,7);g.fill();
}
function loop(){cancelAnimationFrame(raf);last=performance.now();const f=t=>{const dt=Math.min(.033,(t-last)/1000);last=t;tick(dt);draw();if(state!=='over')raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)}
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a'){left=true;e.preventDefault()}
  else if(e.key==='ArrowRight'||e.key.toLowerCase()==='d'){right=true;e.preventDefault()}
  else if(e.key===' '){e.preventDefault();if(state==='over')start();else go()}
  else if(e.key==='Enter'){e.preventDefault();start()}
});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')left=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')right=false});
C.addEventListener('pointermove',e=>{const r=C.getBoundingClientRect();bat.x=Math.max(bat.w/2,Math.min(W-bat.w/2,(e.clientX-r.left)/r.width*W))});
C.addEventListener('pointerdown',()=>{if(state==='over')start();else go()});
$('new').onclick=()=>{start();C.focus()};
addEventListener('resize',fit);
addEventListener('blur',()=>{left=right=false;if(state==='play'){state='held';say('Paused. Space or a click to go on.')}});
fit();start();
</script>
</body>
</html>
