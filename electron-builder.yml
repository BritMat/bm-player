appId: "com.bmplayer.app"
productName: "BM Player"
copyright: "Copyright © 2026 BM Player"

# The updater reads app-update.yml from the packaged resources, and
# electron-builder only writes that file when a publish target exists.
# Point `owner`/`repo` at your GitHub repository before cutting a release;
# until then setupUpdater() detects the missing feed and stays quiet.
publish:
  - provider: github
    owner: BritMat
    repo: bm-player

directories:
  output: "dist"
  buildResources: "buildResources"

files:
  - "main.js"
  - "preload.js"
  - "switches.js"
  - "plugin-safety.js"
  - "plugin-templates/**/*"
  - "src/**/*"
  - "plugins/**/*"
  - "node_modules/**/*"
  - "!node_modules/*/{CHANGELOG.md,README.md,readme.md}"
  - "!node_modules/**/*.d.ts"
  - "!node_modules/.bin"
  - "!dist"

extraResources:
  - from: "vendor/mpv"
    to: "mpv"
    filter: ["**/*", "!*.md", "!.keep"]

# File associations — electron-builder generates the right OS-native
# mechanism from this single cross-platform block (Windows registry,
# macOS Info.plist CFBundleDocumentTypes, Linux .desktop MIME entries).
# icon.png is auto-converted to whatever format each platform needs.
fileAssociations:
  - ext: ["mp4", "m4v", "mkv", "avi", "mov", "wmv", "flv", "webm", "ts",
          "m2ts", "mpg", "mpeg", "ogv", "3gp", "vob"]
    name: "Video File"
    description: "Video file (BM Player)"
    role: "Viewer"
    icon: "buildResources/icon.ico"
  - ext: ["mp3", "flac", "aac", "ogg", "wav", "m4a", "wma", "opus", "ape", "mka"]
    name: "Audio File"
    description: "Audio file (BM Player)"
    role: "Viewer"
    icon: "buildResources/icon.ico"

# ── Windows ─────────────────────────────────────────────────────────
win:
  icon: "buildResources/icon.png"
  target:
    - target: "nsis"
  artifactName: "BM-Player-Setup-${version}-${arch}.exe"
  requestedExecutionLevel: "asInvoker"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "BM Player"
  deleteAppDataOnUninstall: false
  include: "buildResources/installer.nsh"

# ── macOS ───────────────────────────────────────────────────────────
# NOTE: mpv's --wid window-embedding is less mature on macOS than on
# Windows/X11 per mpv's own docs. This config is believed correct but has
# not been run on real Mac hardware — treat the first CI build as the
# real test, not a confirmed-working release.
mac:
  # Made on macOS by scripts/generate-icon.js (sips and iconutil).
  icon: "buildResources/icon.icns"
  category: "public.app-category.video"
  target:
    - target: "dmg"
      arch: ["x64", "arm64"]
    - target: "zip"
      arch: ["x64", "arm64"]
  artifactName: "BM-Player-${version}-${arch}.${ext}"
  # No Apple Developer ID yet, so the app is ad-hoc signed ("-"): Apple
  # Silicon refuses to run an app with no signature at all, and editing
  # Electron's bundle breaks its original one. Hardened runtime stays off: with
  # ad-hoc signing it makes the app fail to launch unless extra entitlements
  # are added (electron-builder warns about this), and it only matters for
  # Apple's notarization, which needs a Developer ID. Turn both on together
  # with a certificate.
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  title: "BM Player ${version}"

# ── Linux ───────────────────────────────────────────────────────────
# AppImage is the most portable target (no install/root needed); .deb
# covers Debian/Ubuntu directly. mpv is expected on the system PATH
# (see release.yml — installed via apt in CI) rather than bundled, since
# a statically-linked Linux mpv build isn't fetched by this pipeline yet.
linux:
  # Debian packages must name a maintainer with an email.
  maintainer: "Bristo <reach.bristo@gmail.com>"
  icon: "buildResources/icon.png"
  category: "AudioVideo"
  target:
    - target: "AppImage"
      arch: ["x64"]
    - target: "deb"
      arch: ["x64"]
  artifactName: "BM-Player-${version}-${arch}.${ext}"

deb:
  depends: ["mpv"]
